    <h2>2. 生態調查（環境教育）</h2>
    
    
    <h3>挺水植物觀察</h3>
    
    <p>在岸邊淺水區，成功觀測到桃園特有且瀕危的<strong>台灣萍蓬草</strong>（黃色小花，葉片浮於水面）。此外還有香蒲、風車草等常見挺水植物，具備良好的水質淨化功能。</p>
    
    
    <h3>動物與鳥類紀錄</h3>
    
    <ul>
    
    <li><strong>紅冠水雞：</strong> 常在草叢邊緣築巢，游動時頭部會前後晃動。</li>
    
    <li><strong>小鸊鷉：</strong> 擅長潛水捕魚，驚嚇時會迅速潛入水中。</li>
    
    <li><strong>夜鷺與小白鷺：</strong> 在埤塘木棧道旁伺機守候捕食小魚。</li>
    
    </ul>
    
    <h3>昆蟲與水質指標</h3>
    
    <p>現場紀錄到高密度的<strong>紅蜻蜓</strong>、<strong>青斑鳳蝶</strong>與<strong>粗鉤春蜓</strong>。由於蜻蜓稚蟲（水蠆）對化學污染極度敏感，此處觀測到的大量群聚，反映出白鷺鷥埤塘目前處於<strong>中度偏向良好</strong>的水質狀態。</p>
