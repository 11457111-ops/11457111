    <h2>4. 變遷與現狀（社會責任）</h2>
    
    
    <h3>土地利用對比（20年前 vs 現在）</h3>
    
    <p>透過 Google Earth 歷史衛星圖比對：</p>
    
    <ul>
    
    <li><strong>2006年：</strong> 埤塘四周皆為青翠的稻田與少許三合院，水域面積完整。</li>
    
    <li><strong>2026年：</strong> 周邊農地大量轉型為透天住宅區與科技園區，部分水域邊緣已被道路拓寬填平。</li>
    
    </ul>
    
    <h3>轉型功能</h3>
    
    <p>目前白鷺鷥埤塘已從純粹的<strong>農業灌溉</strong>功能，成功轉型為兼具<strong>都市滯洪池</strong>與市民休閒的<strong>綠地休憩公園</strong>。</p>
    
    <h3>面臨的挑戰</h3>
    
    <p>目前面臨三大生態危機：</p>
    
    <ol>
    
    <li>生活污水排入導致局部水質富營養化。</li>
    
    <li><strong>福壽螺</strong>大量啃食萍蓬草幼苗。</li>
    
    <li>外來種<strong>泰國鱧（線鱧）</strong>肆虐，嚴重破壞原生小魚與兩棲類的生存空間。</li>
    
    </ol>
